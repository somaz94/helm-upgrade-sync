name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the code targets; 3.14 catches the deprecations
        # that land before they become errors.
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lint
        run: make lint

      # The suite is stdlib-only and builds its fixtures in temp dirs, so no
      # install step and no network access are needed.
      - name: Test
        run: make test
